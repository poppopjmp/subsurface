# Modified from the sample workflow suggested by GitHub/Semmle
#
name: "CodeQL"

on:
  push:
    # once this works, this should be
    # branches: [master]
    branches:
      - master
      - codeQL
    paths-ignore:
      - scripts/docker/**

  pull_request:
    # The branches below must be a subset of the branches above
    branches:
      - master
    paths-ignore:
      - scripts/docker/**

  schedule:
    - cron: '0 2 * * 6'

permissions: read-all

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # Override automatic language detection by changing the below list
        # Supported options are ['csharp', 'cpp', 'go', 'java', 'javascript', 'python']
        language:
          - c-cpp
          - javascript-typescript

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive

    - name: get container ready for build
      run: |
        sudo apt-get update
        sudo apt-get install -y -q \
        autoconf automake cmake g++ git libcrypto++-dev libcurl4-gnutls-dev \
        libgit2-dev libsqlite3-dev libssh2-1-dev libssl-dev \
        libtool libusb-1.0-0-dev libxml2-dev libxslt1-dev libzip-dev make \
        pkg-config xvfb libbluetooth-dev libmtp-dev libraw-dev \
        qt6-base-dev qt6-base-private-dev qt6-declarative-dev \
        qt6-declarative-private-dev qt6-svg-dev qt6-tools-dev \
        qt6-tools-dev-tools qt6-positioning-dev qt6-connectivity-dev \
        qt6-5compat-dev qt6-multimedia-dev libqt6opengl6-dev \
        qml6-module-qtquick qml6-module-qtpositioning

    - name: set environment variables
      id: set-variables
      run: |
        NUM_CORES=$(nproc)
        echo "number-cores=$NUM_CORES" >> $GITHUB_OUTPUT

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        # queries: ./path/to/local/query, your-org/your-repo/queries@main

    - name: Build
      env:
        MAKEFLAGS: "-j${{ steps.set-variables.outputs.number-cores }}"
      run: |
        cd ..
        git config --global --add safe.directory $GITHUB_WORKSPACE
        git config --global --add safe.directory $GITHUB_WORKSPACE/libdivecomputer
        # analyse the configuration we actually ship: the Qt5/WebKit build left
        # every QT_VERSION_CHECK(6, ...) code path unscanned
        bash -e -x subsurface/scripts/build.sh -desktop -build-with-qt6

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
