name: Snap

on:
  push:
    paths-ignore:
    - scripts/docker/**
    branches:
    - master
  pull_request:
    paths-ignore:
    - scripts/docker/**
    branches:
    - master

concurrency:
  # Cancel a superseded run on a pull request; let pushes to master finish,
  # since those produce the nightly artifacts.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: read-all

jobs:
  Snap:
    runs-on: ubuntu-latest

    timeout-minutes: 60
    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive

    - name: set the version information
      id: version_number
      uses: ./.github/actions/manage-version
      with:
        nightly-builds-secret: ${{ secrets.NIGHTLY_BUILDS }}

    - name: store dummy version and build number for pull request
      if: github.event_name == 'pull_request'
      run: |
        echo "100" > latest-subsurface-buildnumber
        echo "CICD-pull-request" > latest-subsurface-buildnumber-extension

    - name: Set up LXD
      # Pinned to a commit rather than @main: a branch ref runs whatever that
      # branch points at today, in a job that holds the snap store credentials.
      uses: canonical/setup-lxd@da2ac84e727dc534215fd14cd088b9209d65893b # main as of 2026-05-28

    - name: Set up CCache
      id: setup-ccache
      run: |
        sudo apt-get install ccache
        mkdir -p ${HOME}/.ccache
        ccache --max-size=2G
        /snap/bin/lxc profile device add default ccache disk source=${HOME}/.ccache/ path=/root/.ccache

        # Patch snapcraft.yaml to enable ccache
        patch -p1 < .github/workflows/scripts/linux-snap.patch

        # Find common base between master and HEAD to use as cache key.
        git -c protocol.version=2 fetch --no-tags --prune --progress --no-recurse-submodules origin master
        echo "key=$( git merge-base origin/master $GITHUB_SHA )" >> $GITHUB_OUTPUT

    - name: CCache
      uses: actions/cache@v6
      with:
        key: linux-ccache-${{ runner.os }}-${{ steps.setup-ccache.outputs.key }}
        restore-keys: |
          ccache-${{ runner.os }}-
        path: ~/.ccache/**

    - name: Build and verify the snap
      uses: canonical/actions/build-snap@cb345b48c77065507280f3dd9d4f42299af2d1a6 # release as of 2026-06-25
      id: build-snap
      with:
        setup-lxd: false

    - name: Clear CCache stats
      run: ccache --show-stats --zero-stats

    - name: Upload the snap
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.build-snap.outputs.snap-name }}
        path: ${{ steps.build-snap.outputs.snap-path }}
        if-no-files-found: error
