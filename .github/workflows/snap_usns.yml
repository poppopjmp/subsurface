name: SnapUSNs

on:
  workflow_dispatch:
  schedule:
  - cron: '0 5 * * *'

concurrency:
  # Cancel a superseded run on a pull request; let pushes to master finish,
  # since those produce the nightly artifacts.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: read-all

jobs:
  CheckUSNs:
    runs-on: ubuntu-22.04

    steps:
    - name: Check out code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      uses: insightsengineering/pip-action@v2.0.2
      with:
        requirements: .github/workflows/scripts/requirements.txt

    - name: Install Snap dependencies
      run: |
        sudo snap install review-tools --edge

    - name: Set up Launchpad credentials
      uses: DamianReeves/write-file-action@v1.3
      with:
        path: lp_credentials
        contents: ${{ secrets.LAUNCHPAD_CREDENTIALS }}

    - name: Check for USNs
      run: .github/workflows/scripts/check_usns.py lp_credentials
